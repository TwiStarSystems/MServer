# MServer - Nginx Configuration
# ================================================
# Copy this file to /etc/nginx/sites-available/mserver
# then symlink: ln -s /etc/nginx/sites-available/mserver /etc/nginx/sites-enabled/
# Test with: nginx -t && systemctl reload nginx
#
# The install.sh script will automatically generate the appropriate config when
# Nginx option is selected. This file serves as a reference template.

# =============================================
# OPTION 1: HTTP Only (Simple Reverse Proxy)
# =============================================
# Use this if MServer is accessed via IP or no SSL is needed.

server {
    listen 80;
    server_name _;

    # Modest default — only the large-upload locations below override this.
    # A blanket multi-GB limit here would let any client stream arbitrary
    # amounts of data to disk against small JSON/API endpoints.
    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Main application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # WebSocket endpoint (Socket.IO) — needs a long read/send timeout to keep
    # persistent connections alive; this is the only route that does.
    location /socket.io {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Large file uploads (server ZIPs, world imports)
    location /api/servers {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 25G;
    }

    # Tools (whole-panel backup/restore ZIPs, manual JAR downloader) — same
    # large-body / long-timeout needs as /api/servers: restore-all accepts a
    # multi-GB upload, and backup-all/jar-downloader build their response
    # synchronously before sending any bytes back.
    location /api/tools {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 25G;
    }

    # JAR bucket (bulk backup/restore of downloaded JARs) — same reasoning as
    # /api/tools above.
    location /api/jar-bucket {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 25G;
    }

    # Resource pack downloads (public, may be served to MC clients)
    location /resourcepacks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}


