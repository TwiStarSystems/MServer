<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>First-Run Setup - Minecraft Server Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l7.23 3.61-7.23 3.62-7.23-3.62L12 4.18zM4 8.67l7 3.5v6.66l-7-3.5V8.67zm9 10.16v-6.66l7-3.5v6.66l-7 3.5z"/>
                </svg>
            </div>
            <h1>Welcome</h1>
            <p>Create your administrator account to get started</p>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <div class="tab-content active">
            <form id="setup-form">
                <div class="form-group">
                    <label for="setup-username">Username</label>
                    <input type="text" id="setup-username" name="username" required minlength="3" maxlength="32" autocomplete="username">
                    <p class="password-requirements">3–32 characters. "admin" is reserved.</p>
                </div>
                <div class="form-group">
                    <label for="setup-name">Display Name <span class="text-muted">(optional)</span></label>
                    <input type="text" id="setup-name" name="name" maxlength="100" autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="setup-email">Email <span class="text-muted">(optional)</span></label>
                    <input type="email" id="setup-email" name="email" maxlength="254" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="setup-password">Password</label>
                    <input type="password" id="setup-password" name="password" required minlength="12" autocomplete="new-password">
                    <p class="password-requirements">Minimum 12 characters, with an uppercase letter, a lowercase letter, and a number.</p>
                </div>
                <div class="form-group">
                    <label for="setup-confirm">Confirm Password</label>
                    <input type="password" id="setup-confirm" name="confirm" required autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn">Create Admin Account</button>
            </form>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="setup.js"></script>
</body>
</html>
