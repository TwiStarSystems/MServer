# Jar Download URLs Configuration File
# Format: type:version=url
# Lines starting with # are comments
# 
# Server Types:
#   vanilla    - Official Minecraft Server (unmodded)
#   paper      - Paper MC (performance optimized, plugin support)
#   purpur     - Purpur (Paper fork with more features)
#   bungeecord - BungeeCord Proxy (multi-server support)
#   forge      - Forge (mod support)
#   neoforge   - NeoForge (modern Forge fork)
#
# Note: For Paper, Purpur, and some others, we use API endpoints
# that automatically resolve to the latest build for each version.
